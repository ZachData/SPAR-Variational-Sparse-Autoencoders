[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsae-falsification"
version = "1.0.0"
description = "Variational sparse autoencoders (a dictionary_learning fork) and a sequential-falsification framework for validating claims about SAEs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zach" }]
keywords = ["sparse-autoencoders", "mechanistic-interpretability", "e-values", "permutation-tests"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Enough for the falsification framework, its tests, and `reproduce.py`
# (every figure and table in the paper from the committed data, no GPU).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Training and checkpoint-reading: the RTX 3080 environment. Exact versions
# that produced every result are in requirements-lock.txt.
train = [
    "torch>=2.1",
    "transformers>=4.30",
    "datasets>=2.12",
    "einops>=0.6",
    "nnsight>=0.7",
    "transformer_lens>=2.0",
    "tqdm>=4.65",
    "wandb>=0.15",
    "zstandard>=0.21",
    "huggingface_hub>=0.15",
    "pandas>=2.0",
    "seaborn>=0.13",
]
# The E4 size control drives the vendored SAEBench-main/ (v0.4.2, added to
# sys.path by the scorers); it needs SAEBench's own dependencies too.
e4 = [
    "vsae-falsification[train]",
    "sae_lens>=5.4",
    "jaxtyping",
    "beartype",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "tabulate",
]
# dictionary_learning.interp (upstream's feature-visualisation helpers).
interp = ["circuitsvis", "umap-learn>=0.5.3", "plotly"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ZachData/SPAR-Variational-Sparse-Autoencoders"

[tool.setuptools]
packages = ["dictionary_learning", "dictionary_learning.trainers", "falsification"]

[tool.pytest.ini_options]
testpaths = ["falsification/tests"]
